name = "supportly-server-api"
main = "src/index.ts"
compatibility_date = "2026-03-27"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "supportly"
database_id = "de9ab221-a534-4d7a-802d-45d7c5efae61"

[[durable_objects.bindings]]
name = "VISITOR_STREAM"
class_name = "VisitorStream"

[[durable_objects.bindings]]
name = "ADMIN_STREAM"
class_name = "AdminStream"

[[migrations]]
tag = "v1_realtime_streams"
new_sqlite_classes = ["VisitorStream", "AdminStream"]

[vars]
# 以下两项为敏感信息，已通过 `wrangler secret put` 设置（绝不明文写在代码中）：
#   JWT_SECRET          —— 签发/校验管理员与客服 JWT
#   WIDGET_TOKEN_SECRET —— 校验客服挂件(widget)请求令牌
# 修改/重置命令：wrangler secret put JWT_SECRET / wrangler secret put WIDGET_TOKEN_SECRET

# 邮件通知配置（使用 Resend 免费 API，每天100封）
# 注册地址：https://resend.com
# 注意：RESEND_API_KEY 为敏感信息，请使用 `wrangler secret put RESEND_API_KEY` 设置
EMAIL_NOTIFICATION_ENABLED = "true"
# RESEND_API_KEY 通过 wrangler secret put 设置，不写在代码中
EMAIL_FROM = "RCJ 客服 <noreply@955827.xyz>"
EMAIL_NOTIFY_TO = "1430115702@qq.com"
